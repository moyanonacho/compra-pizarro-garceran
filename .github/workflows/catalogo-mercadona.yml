# Cada mes descarga el catálogo de Mercadona (Tres Cantos, 28760) y lo sube a Supabase, de donde lo lee la web.
name: Catálogo Mercadona
on:
  schedule:
    - cron: "17 8 1 * *"   # día 1 de cada mes, 08:17 UTC
  workflow_dispatch: {}     # también se puede lanzar a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Descargar catálogo
        run: python herramientas/actualizar_mercadona.py nuevo
      - name: Comprobar que está completo
        run: python -c "import json;d=json.load(open('nuevo/mercadona.json'));n=len(d['p']);print(n,'productos');assert n>2000,'catálogo sospechosamente pequeño'"
      - name: Subir a Supabase
        env:
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASSWORD: ${{ secrets.ROBOT_PASSWORD }}
        run: python herramientas/subir_catalogo.py nuevo mercadona | tee -a registro.txt
      - name: Apuntarlo en el registro
        # una subida al mes mantiene vivo el repositorio (GitHub para las tareas programadas tras 60 días sin cambios)
        run: |
          sed -i "\$s/^/$(date +%F) /" registro.txt
          git config user.name "Catálogo automático"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registro.txt
          git commit -m "Catálogo Mercadona $(date +%F)"
          git push
