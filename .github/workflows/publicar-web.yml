# Publica la web en GitHub Pages cuando cambia (los catálogos están en Supabase, no aquí).
name: Publicar web
on:
  push:
    branches: [main]
    paths-ignore: [registro.txt]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar solo lo que necesita la web
        run: mkdir _site && cp -r index.html icono.png manifest.webmanifest logos .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
